services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cadence-db
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_dev
      POSTGRES_DB: cadence
    ports:
      - "5436:5432"
    volumes:
      - cadence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadence_pgdata:
